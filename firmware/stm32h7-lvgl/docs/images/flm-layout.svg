<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ld" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="hs" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
    <marker id="sk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <style>
    .ttl { font-size: 15px; fill: #111827; font-weight: 700; }
    .sub { font-size: 11px; fill: #6b7280; }
    .hdr { font-size: 12px; fill: #374151; font-weight: 700; }
    .sec { font-size: 12px; fill: #111827; font-weight: 600; }
    .dtl { font-size: 10px; fill: #6b7280; }
    .ann { font-size: 11px; fill: #374151; }
    .box { stroke-width: 1.5; rx: 3; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #6b7280; }
  </style>

  <text x="24" y="30" class="ttl">.FLM 은 ELF 파일이다 — 무엇을 타깃에 올리고 무엇을 호스트가 읽는가</text>
  <text x="24" y="50" class="sub">STM32F4xx_512.FLM 실측. 13,888 B 중 실제로 타깃에 올라가는 건 332 B 뿐이다.</text>

  <!-- ===== 파일 ===== -->
  <text x="24" y="82" class="hdr">.FLM 파일 (ELF32, ET_EXEC, EM_ARM)</text>

  <rect x="24" y="92"  width="200" height="30" class="box" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="36" y="112" class="sec" fill="#6b7280">ELF 헤더 · 섹션 표</text>

  <rect x="24" y="126" width="200" height="46" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="36" y="145" class="sec">PrgCode</text>
  <text x="36" y="162" class="dtl">328 B · addr 0x0000 · [AX]</text>

  <rect x="24" y="176" width="200" height="36" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="36" y="194" class="sec">PrgData</text>
  <text x="36" y="207" class="dtl">4 B · addr 0x0148 · [WA]</text>

  <rect x="24" y="216" width="200" height="52" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="36" y="235" class="sec">DevDscr</text>
  <text x="36" y="250" class="dtl">4,256 B · addr 0x014C · [A]</text>
  <text x="36" y="263" class="dtl">FlashDevice 구조체</text>

  <rect x="24" y="272" width="200" height="40" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="36" y="290" class="sec">.symtab / .strtab</text>
  <text x="36" y="305" class="dtl">함수 주소</text>

  <rect x="24" y="316" width="200" height="34" class="box" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="4 2"/>
  <text x="36" y="334" class="sec" fill="#9ca3af">.debug_* · .comment</text>
  <text x="36" y="346" class="dtl">9 KB — 안 쓴다</text>

  <!-- ===== 화살표 + 설명 ===== -->
  <path d="M 228,149 L 424,149" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ld)"/>
  <path d="M 228,194 L 424,194" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ld)"/>
  <text x="252" y="143" class="ann" fill="#2563eb">타깃 RAM 으로 로드</text>
  <text x="252" y="188" class="ann" fill="#2563eb">재배치 후 그대로 복사</text>

  <path d="M 228,242 L 300,242 L 300,400" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#hs)"/>
  <path d="M 228,292 L 270,292 L 270,400" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#hs)"/>


  <!-- ===== 타깃 RAM ===== -->
  <text x="440" y="82" class="hdr">타깃 RAM 아레나</text>

  <rect x="440" y="92"  width="210" height="30" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="452" y="112" class="sec">0xBE00BE00</text>
  <text x="660" y="105" class="ann">bkpt 트램폴린</text>
  <text x="660" y="119" class="dtl">LR 이 여기를 가리킨다</text>

  <rect x="440" y="126" width="210" height="46" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="452" y="145" class="sec">PrgCode</text>
  <text x="452" y="162" class="dtl">Init / EraseSector / ProgramPage</text>
  <text x="660" y="145" class="ann">code_addr</text>
  <text x="660" y="159" class="dtl">delta = code_addr − 0</text>

  <rect x="440" y="176" width="210" height="36" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="452" y="197" class="sec">PrgData</text>
  <text x="660" y="190" class="ann">static_base → R9</text>
  <text x="660" y="204" class="dtl">RWPI 알고리즘용</text>

  <rect x="440" y="216" width="210" height="44" class="box" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="452" y="242" class="sec" fill="#6b7280">스택 (0x800)</text>
  <text x="660" y="242" class="ann">stack_top → SP</text>

  <rect x="440" y="264" width="210" height="46" class="box" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="452" y="283" class="sec">데이터 버퍼</text>
  <text x="452" y="300" class="dtl">szPage = 1024 B</text>
  <text x="660" y="283" class="ann">ProgramPage 의 buf 인자</text>
  <text x="660" y="297" class="dtl">굽을 데이터를 여기 채운다</text>

  <!-- ===== 호스트가 읽는 정보 ===== -->
  <rect x="180" y="396" width="420" height="126" class="box" fill="#fffbeb" stroke="#d97706" stroke-dasharray="4 2"/>
  <text x="196" y="422" class="hdr" fill="#92400e">호스트가 읽고 타깃에는 안 올리는 것</text>

  <text x="196" y="444" class="ann">FlashDevice</text>
  <text x="290" y="444" class="mono">DevAdr 0x08000000 · szDev 512KB · szPage 1024</text>
  <text x="290" y="459" class="mono">toProg 100ms · toErase 6000ms · valEmpty 0xFF</text>
  <text x="290" y="474" class="mono">섹터 16K×4 + 64K×1 + 128K×3</text>

  <text x="196" y="497" class="ann">심볼</text>
  <text x="290" y="497" class="mono">Init 0x1D · UnInit 0x4F · EraseChip 0x5D</text>
  <text x="290" y="510" class="mono">EraseSector 0x89 · ProgramPage 0xD5   (전부 Thumb 비트)</text>

  <!-- 범례 -->
  <rect x="640" y="400" width="14" height="12" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="660" y="410" class="dtl">타깃으로 로드</text>
  <rect x="640" y="422" width="14" height="12" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="660" y="432" class="dtl">호스트가 파싱</text>
  <rect x="640" y="444" width="14" height="12" class="box" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="4 2"/>
  <text x="660" y="454" class="dtl">무시</text>
  <rect x="640" y="466" width="14" height="12" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="660" y="476" class="dtl">러너가 심는 것</text>
</svg>
